{% extends 'base.html' %}{% block title %}New Schedule{% endblock %}
{% block content %}
<div class="d-flex align-items-center gap-3 mb-4">
<a href="{{ url_for('schedule.index') }}" class="btn-surface"><i class="bi bi-arrow-left me-1"></i>Back</a>
<h1 class="page-title">Schedule Ad</h1></div>
<div class="card-modern p-5" style="max-width:600px">
<h5 class="section-title mb-4">{{ ad.title }}</h5>
<form method="POST">
<div class="mb-3"><label class="form-label">Location</label>
<select name="location" class="form-select">
{% for l in ['Mall Billboard','City Center Screen','Food Court Display','Highway Billboard','Airport Terminal','Metro Station'] %}
<option value="{{ l }}" {{ 'selected' if l==ad.location }}>{{ l }}</option>{% endfor %}
</select></div>
<div class="row g-3 mb-3"><div class="col-6"><label class="form-label">Start</label>
<input type="datetime-local" name="start_time" class="form-control" required></div>
<div class="col-6"><label class="form-label">End</label>
<input type="datetime-local" name="end_time" class="form-control" required></div></div>
<div class="mb-4"><label class="form-label">Duration (seconds per display)</label>
<input type="number" name="duration" class="form-control" value="30" min="5" max="120"></div>
<button type="submit" class="btn-gradient w-100 justify-content-center py-3">Create Schedule</button>
</form></div>{% endblock %}
