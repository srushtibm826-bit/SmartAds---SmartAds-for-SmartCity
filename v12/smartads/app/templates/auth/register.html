<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register — SmartAds</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d18;--bg-card:#13131f;--bg-elevated:#1a1a2e;--border:rgba(255,255,255,.08);
--text:rgba(255,255,255,.95);--text-muted:rgba(255,255,255,.4);--accent:#6366f1;--accent-glow:rgba(99,102,241,.15);}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:20px;}
.card-modern{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:40px;}
.brand-logo{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;
  background:linear-gradient(135deg,#6366f1,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.form-control{background:var(--bg-elevated)!important;border:1px solid var(--border)!important;
  color:var(--text)!important;border-radius:10px!important;padding:12px 14px!important;}
.form-control:focus{border-color:var(--accent)!important;box-shadow:0 0 0 3px var(--accent-glow)!important;outline:none!important;}
.form-control::placeholder{color:var(--text-muted)!important;}
.form-label{font-size:.82rem;font-weight:600;color:rgba(255,255,255,.65);margin-bottom:6px;display:block;}
.btn-gradient{background:linear-gradient(135deg,#6366f1,#ec4899);border:none;color:white;
  padding:12px 24px;border-radius:10px;font-weight:700;cursor:pointer;width:100%;font-size:1rem;}
.alert-danger{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#fca5a5;border-radius:10px;padding:12px;margin-bottom:16px;font-size:.875rem;}
</style>
</head>
<body>
<div style="width:100%;max-width:440px">
  <div class="text-center mb-5">
    <div class="brand-logo">⚡ SmartAds</div>
  </div>
  <div class="card-modern">
    <h2 style="font-family:'Syne',sans-serif;font-weight:800;margin-bottom:24px;text-align:center">Create Account</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}{% for cat,msg in messages %}<div class="alert-danger">{{ msg }}</div>{% endfor %}{% endif %}
    {% endwith %}
    <form method="POST">
      <div class="mb-3"><label class="form-label">Full Name</label><input type="text" name="name" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
      <div class="mb-4"><label class="form-label">Confirm Password</label><input type="password" name="confirm_password" class="form-control" required></div>
      <button type="submit" class="btn-gradient">Create Account</button>
    </form>
    <p style="text-align:center;margin-top:20px;font-size:.85rem;color:var(--text-muted)">
      Have account? <a href="/auth/login" style="color:var(--accent)">Sign In</a></p>
  </div>
</div>
</body></html>
